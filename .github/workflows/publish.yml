name: Publish staging

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        type: boolean
        default: true
        description: Verify and package only

permissions:
  contents: read

concurrency:
  group: publish-staging
  cancel-in-progress: false

jobs:
  stage:
    if: github.repository == 'photon-hq/hono-openapi'
    uses: photon-hq/buildspace/.github/workflows/package-stage.yml@6bbaf8bd45dcf21105467ce5ba38e32adb4f18d1
    permissions:
      contents: write
      packages: write
      actions: read
      attestations: write
      id-token: write
    with:
      ci-workflow: test.yml
      verify: pnpm test --run
      pack: node scripts/pack-release.mjs
      dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
