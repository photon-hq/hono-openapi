name: Promote to production

on:
  workflow_dispatch:
    inputs:
      staging_version:
        type: string
        default: ""
        description: Staging version to promote (blank promotes the current staging tag)

permissions:
  contents: read

jobs:
  promote:
    if: github.repository == 'photon-hq/hono-openapi'
    uses: photon-hq/buildspace/.github/workflows/package-promote.yml@61d4f35e4ff5f877532766cbf25db25579437ea7
    permissions:
      contents: write
      packages: write
      actions: read
      attestations: read
    with:
      staging-version: ${{ inputs.staging_version }}
