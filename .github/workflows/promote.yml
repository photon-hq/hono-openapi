name: Promote to production

on:
  workflow_dispatch:
    inputs:
      staging_version:
        type: string
        default: ""
        description: Staging version to promote (blank promotes the current staging tag)

permissions:
  contents: read

jobs:
  promote:
    if: github.repository == 'photon-hq/hono-openapi'
    uses: photon-hq/buildspace/.github/workflows/package-promote.yml@6bbaf8bd45dcf21105467ce5ba38e32adb4f18d1
    permissions:
      contents: write
      packages: write
      actions: read
      attestations: read
    with:
      staging-version: ${{ inputs.staging_version }}
